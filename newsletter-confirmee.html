    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy:        #1B2A6B;
            --navy-dark:   #101A50;
            --peach:       #D4956A;
            --peach-light: #E8B48A;
            --peach-pale:  #F5EBE0;
            --white:       #FFFFFF;
            --text-medium: #4A5568;
            --text-light:  #718096;
        }

        html { font-size: 16px; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-medium);
            background: var(--white);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── NAV ─── */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 1.2rem 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(14px);
            box-shadow: 0 1px 24px rgba(27,42,107,0.08);
        }
        .nav-brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .nav-logo { width: 38px; height: 38px; object-fit: contain; }
        .nav-name { font-weight: 700; font-size: 0.95rem; color: var(--navy); }
        .nav-back {
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-medium);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: color 0.2s;
        }
        .nav-back:hover { color: var(--navy); }

        /* ─── CONFIRMATION ─── */
        .confirm {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8rem 1.5rem 4rem;
        }
        .confirm-inner { max-width: 560px; }
        .confirm-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: var(--peach-pale);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirm-badge svg { width: 40px; height: 40px; }
        .confirm h1 {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--navy);
            line-height: 1.1;
            margin-bottom: 1rem;
        }
        .confirm p {
            font-size: 1.08rem;
            color: var(--text-medium);
            margin-bottom: 2.3rem;
        }
        .confirm-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            background: var(--peach);
            color: var(--white);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 10px 28px rgba(212,149,106,0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-primary:hover { background: var(--peach-light); transform: translateY(-2px); }
        .link-secondary {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }
        .link-secondary:hover { color: var(--navy); }

        /* ─── FOOTER ─── */
        .footer-copy {
            text-align: center;
            padding: 2rem 1.5rem;
            font-size: 0.82rem;
            color: var(--text-light);
            background: var(--navy-dark);
        }
        .footer-copy a { color: inherit; text-decoration: none; }
        .footer-copy a:hover { text-decoration: underline; }

        @media (max-width: 860px) {
            nav { padding: 1rem 1.5rem; }
            .nav-name { display: none; }
        }
    </style>
</head>
